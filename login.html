<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiva - Se connecter</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body class="auth-page">

    <div class="auth">
        <!-- Formulaire de connexion -->
        <div class="auth__content">
            <a href="index.html" class="auth__back">
                ← Retour à l'accueil
            </a>

            <h1 class="auth__title">Se connecter</h1>

            <form action="cers.html" method="GET" class="auth__form">
                <!-- Champ Email -->
                <div class="auth__field">
                    <label for="login-email" class="auth__label">Email</label>
                    <div class="auth__input-wrap">
                        <input type="email" id="login-email" class="auth__input" placeholder="Entrer votre email" required>
                    </div>
                </div>

                <!-- Champ Mot de passe -->
                <div class="auth__field">
                    <label for="login-password" class="auth__label">Mot de passe</label>
                    <div class="auth__input-wrap">
                        <input type="password" id="login-password" class="auth__input" placeholder="Entrer votre mot de passe" required>
                        <button type="button" class="auth__eye-btn" aria-label="Afficher le mot de passe">
                            👁
                        </button>
                    </div>
                </div>

                <!-- Mot de passe oublié -->
                <div class="auth__helper">
                    <a href="#" class="auth__helper-link">Mot de passe oublié ?</a>
                </div>

                <!-- Bouton Se connecter -->
                <button type="submit" class="btn btn--primary btn--full">
                    Se connecter
                </button>
            </form>

            <!-- Pied de page carte -->
            <p class="auth__footer">
                Vous n'avez pas de compte ? 
                <a href="register.html" class="auth__footer-link">Créez un nouveau compte ↗</a>
            </p>
        </div>

        <!-- Illustration visuelle latérale -->
        <div class="auth__visual">
            <img src="assets/ChatGPT Image Sep 20, 2026, 11_33_46 PM.png" alt="Illustration de connexion" class="auth__illustration">
        </div>
    </div>

</body>
</html>
